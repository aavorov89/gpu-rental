services:
  postgres:
    image: postgres:17-alpine
    container_name: gpu-rental-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gpu_rental}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gpu_rental}
      POSTGRES_DB: ${POSTGRES_DB:-gpu_rental}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
